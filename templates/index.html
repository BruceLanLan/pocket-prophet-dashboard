<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>口袋先知</title>
<style>
body{font-family:-apple-system,Helvetica,Arial,sans-serif;background:#f5f3ee;color:#1d1d1f;margin:0;padding:18px;max-width:480px;margin-left:auto;margin-right:auto}
h1{font-size:22px;margin:4px 0 14px}
.card{background:#fff;padding:18px;border-radius:18px;margin:12px 0;box-shadow:0 8px 24px rgba(0,0,0,.07)}
.status{display:flex;align-items:center;gap:8px;font-size:14px;color:#6e6e73;margin-bottom:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#d1d1d6;flex-shrink:0}
.dot.online{background:#34c759}
.dot.offline{background:#ff9500}
.btn{width:100%;background:#111;color:#fff;padding:15px;text-align:center;border:0;border-radius:12px;font-size:17px;cursor:pointer}
.btn:disabled{background:#d1d1d6;color:#8e8e93;cursor:not-allowed}
.result{margin-top:16px}
.result img{display:block;width:200px;height:200px;image-rendering:pixelated;margin:0 auto 12px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.hexname{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
.judge{font-size:14px;color:#4b4035;text-align:center;margin-bottom:8px}
.pushmsg{font-size:13px;text-align:center;padding:8px;border-radius:8px}
.pushmsg.ok{background:#e8f8ea;color:#248a3d}
.pushmsg.skip{background:#eef2f6;color:#4b5563}
.pushmsg.err{background:#fdecea;color:#d70015}
.hint{font-size:12px;color:#8e8e93;text-align:center;margin-top:10px}
.pagerow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0ede6}
.pagerow:last-child{border-bottom:none}
.pagerow .label{flex:1;font-size:15px}
.pagerow .actions{display:flex;gap:6px}
.smallbtn{background:#ebe7df;color:#4b4035;border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
.smallbtn.primary{background:#111;color:#fff}
.smallbtn:disabled{opacity:.5;cursor:not-allowed}
.pagepreview{margin-top:10px;text-align:center}
.pagepreview img{width:160px;height:160px;image-rendering:pixelated;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.autostatus{font-size:13px;color:#6e6e73;display:flex;align-items:center;gap:6px}
.autostatus .armdot{width:8px;height:8px;border-radius:50%;background:#d1d1d6}
.autostatus .armdot.on{background:#34c759}
</style>
</head>
<body>
<h1>🔮 口袋先知 <a href="/settings" style="float:right;font-size:14px;color:#6e6e73;text-decoration:none">⚙️ 设置</a></h1>
<div class="card">
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">检查设备状态…</span>
  </div>
  <div class="autostatus" id="autoStatus"></div>
  <button class="btn" id="divineBtn" onclick="divine()">摇卦</button>
  <div class="result" id="result" style="display:none"></div>
</div>

<div class="card">
  <button class="btn" id="qimenBtn" onclick="doQimen()">🔯 起一盘奇门遁甲</button>
  <div class="result" id="qimenResult" style="display:none"></div>
</div>

<div class="card">
  <div class="pagerow">
    <span class="label">🌤️ 天气</span>
    <div class="actions">
      <button class="smallbtn" onclick="previewPage('weather')">预览</button>
      <button class="smallbtn primary" onclick="pushPage('weather')">推送</button>
    </div>
  </div>
  <div class="pagerow">
    <span class="label">📈 行情</span>
    <div class="actions">
      <button class="smallbtn" onclick="previewPage('stocks')">预览</button>
      <button class="smallbtn primary" onclick="pushPage('stocks')">推送</button>
    </div>
  </div>
  <div class="pagerow">
    <span class="label">📰 要闻</span>
    <div class="actions">
      <button class="smallbtn" onclick="previewPage('news')">预览</button>
      <button class="smallbtn primary" onclick="pushPage('news')">推送</button>
    </div>
  </div>
  <div class="pagerow">
    <span class="label">📊 Token 用量</span>
    <div class="actions">
      <button class="smallbtn" onclick="previewPage('usage')">预览</button>
      <button class="smallbtn primary" onclick="pushPage('usage')">推送</button>
    </div>
  </div>
  <div class="pagepreview" id="pagePreview" style="display:none"></div>
</div>

<script>
async function refreshStatus(){
  try{
    const r = await fetch('/api/status');
    const j = await r.json();
    const dot = document.getElementById('dot');
    const text = document.getElementById('statusText');
    if(!j.configured){
      dot.className = 'dot';
      text.textContent = '尚未配置设备 IP（编辑 config.json）';
    } else if(j.online){
      dot.className = 'dot online';
      text.textContent = '设备在线 · ' + j.ip;
    } else {
      dot.className = 'dot offline';
      text.textContent = '设备不在线 · 请在设备上打开「更换壁纸」界面';
    }
  }catch(e){
    document.getElementById('statusText').textContent = '状态检查失败';
  }
}

async function divine(){
  const btn = document.getElementById('divineBtn');
  const result = document.getElementById('result');
  btn.disabled = true;
  btn.textContent = '摇卦中…';
  result.style.display = 'none';

  try{
    const r = await fetch('/api/divine', {method:'POST'});
    const j = await r.json();

    if(!r.ok){
      result.innerHTML = `<div class="pushmsg err">${j.hint || '请求失败'}</div>`;
      result.style.display = 'block';
      return;
    }

    const c = j.cast;
    const title = c['变卦'] ? `${c['本卦']} → ${c['变卦']}` : `${c['本卦']}（不变）`;
    const mv = (c['动爻'] && c['动爻'].length) ? ('动爻：' + c['动爻'].join('、')) : '六爻不动';

    let pushHtml;
    if(j.push.ok && !j.push.skipped){
      pushHtml = `<div class="pushmsg ok">已推送到设备</div>`;
    } else if(j.push.ok && j.push.skipped){
      pushHtml = `<div class="pushmsg skip">内容与设备当前显示相同，未重复推送</div>`;
    } else {
      pushHtml = `<div class="pushmsg err">${j.push.hint || '推送失败'}</div>`;
    }

    const img = j.preview_png_b64
      ? `<img src="data:image/png;base64,${j.preview_png_b64}" alt="卦象预览">`
      : '';

    result.innerHTML = `
      ${img}
      <div class="hexname">${title}</div>
      <div class="judge">${c['判断'] || ''}</div>
      <div class="hint">${mv}</div>
      ${pushHtml}
    `;
    result.style.display = 'block';
  }catch(e){
    result.innerHTML = `<div class="pushmsg err">网络错误：${e}</div>`;
    result.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = '摇卦';
    refreshStatus();
  }
}

async function doQimen(){
  const btn = document.getElementById('qimenBtn');
  const result = document.getElementById('qimenResult');
  btn.disabled = true;
  btn.textContent = '起盘中…';
  result.style.display = 'none';

  try{
    const r = await fetch('/api/qimen', {method:'POST'});
    const j = await r.json();

    if(!r.ok){
      result.innerHTML = `<div class="pushmsg err">${j.hint || '请求失败'}</div>`;
      result.style.display = 'block';
      return;
    }

    const c = j.cast;
    let pushHtml;
    if(j.push.ok && !j.push.skipped){
      pushHtml = `<div class="pushmsg ok">已推送到设备</div>`;
    } else if(j.push.ok && j.push.skipped){
      pushHtml = `<div class="pushmsg skip">内容与设备当前显示相同，未重复推送</div>`;
    } else {
      pushHtml = `<div class="pushmsg err">${j.push.hint || '推送失败'}</div>`;
    }

    const img = j.preview_png_b64
      ? `<img src="data:image/png;base64,${j.preview_png_b64}" alt="奇门遁甲预览">`
      : '';

    result.innerHTML = `
      ${img}
      <div class="hexname">${c['局']}</div>
      <div class="judge">值符：${c['值符星']}（${c['值符宫']}宫）· 时柱 ${c['时柱']}</div>
      ${pushHtml}
    `;
    result.style.display = 'block';
  }catch(e){
    result.innerHTML = `<div class="pushmsg err">网络错误：${e}</div>`;
    result.style.display = 'block';
  }finally{
    btn.disabled = false;
    btn.textContent = '🔯 起一盘奇门遁甲';
    refreshStatus();
  }
}

async function previewPage(page){
  const box = document.getElementById('pagePreview');
  box.style.display = 'block';
  box.innerHTML = '预览中…';
  try{
    const r = await fetch('/api/preview?page=' + page);
    const j = await r.json();
    if(!r.ok || !j.ok){
      box.innerHTML = `<div class="pushmsg err">${j.hint || '预览失败'}</div>`;
      return;
    }
    box.innerHTML = `<img src="data:image/png;base64,${j.preview_png_b64}" alt="${page} 预览">
      <div class="hint">仅预览，未推送设备 · ${j.payload_len} 字符</div>`;
  }catch(e){
    box.innerHTML = `<div class="pushmsg err">网络错误：${e}</div>`;
  }
}

async function pushPage(page){
  const box = document.getElementById('pagePreview');
  box.style.display = 'block';
  box.innerHTML = '推送中…';
  try{
    const r = await fetch('/api/push_page?page=' + page, {method: 'POST'});
    const j = await r.json();
    if(!r.ok){
      box.innerHTML = `<div class="pushmsg err">${j.hint || '请求失败'}</div>`;
      return;
    }
    const img = j.preview_png_b64
      ? `<img src="data:image/png;base64,${j.preview_png_b64}" alt="${page}">`
      : '';
    let msg;
    if(j.push.ok && !j.push.skipped) msg = `<div class="pushmsg ok">已推送到设备</div>`;
    else if(j.push.ok && j.push.skipped) msg = `<div class="pushmsg skip">内容与设备当前显示相同，未重复推送</div>`;
    else msg = `<div class="pushmsg err">${j.push.hint || '推送失败'}</div>`;
    box.innerHTML = img + msg;
  }catch(e){
    box.innerHTML = `<div class="pushmsg err">网络错误：${e}</div>`;
  }finally{
    refreshStatus();
  }
}

function fmtTime(iso){
  if(!iso) return null;
  const d = new Date(iso);
  return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
}

async function refreshAutoStatus(){
  try{
    const r = await fetch('/api/scheduler_status');
    const j = await r.json();
    const box = document.getElementById('autoStatus');
    if(!j.armed){
      box.innerHTML = `<span class="armdot"></span> 自动推送未布防（在设置页开启）`;
      return;
    }
    let extra = '';
    if(j.last_push_at){
      const ok = j.last_push_ok;
      extra = ` · 上次 ${fmtTime(j.last_push_at)} ${j.last_push_page || ''} ${ok ? '✓' : '✗'}`;
    }
    const next = j.next_push_at ? `下次约 ${fmtTime(j.next_push_at)}` : '';
    box.innerHTML = `<span class="armdot on"></span> 自动推送已布防 · ${next}${extra}`;
  }catch(e){
    // 静默失败，不打扰主界面
  }
}

refreshStatus();
refreshAutoStatus();
setInterval(refreshStatus, 8000);
setInterval(refreshAutoStatus, 8000);
</script>
</body>
</html>
